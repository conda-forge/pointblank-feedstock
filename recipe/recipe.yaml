context:
  name: pointblank
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pointblank/pointblank-${{ version }}.tar.gz
  sha256: 88f083db328a6a8b604f65bcae7f46896b97c7b35b8d7c53f2bcba1a4b38d308

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm >=6.2
  run:
    - python >=${{ python_min }}
    - commonmark >=0.9.1
    - importlib-metadata
    - great_tables >=0.22.0
    - narwhals >=2.0.1
    - typing_extensions >=3.10.0.0
    - requests >=2.31.0
    - click >=8.0.0
    - rich >=13.0.0
    - pyyaml >=6.0.0
    - anthropic >=0.68.0

tests:
  - python:
      imports:
        - pointblank
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Find out if your data is what you think it is.
  homepage: https://posit-dev.github.io/pointblank/
  repository: https://github.com/posit-dev/pointblank

extra:
  recipe-maintainers:
    - rich-iannone
    - timkpaine
