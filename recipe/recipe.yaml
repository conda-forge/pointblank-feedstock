context:
  name: pointblank
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pointblank/pointblank-${{ version }}.tar.gz
  sha256: 8e685e29a34d2976baa1f79f4ae593329fd5b38fb1a2d93aba02593b110ffac4

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm >=6.2
  run:
    - python >=${{ python_min }}
    - importlib-metadata
    - commonmark >=0.9.1
    - great_tables >=1.1.0
    - narwhals >=2.8.0
    - typing_extensions >=3.10.0.0
    - requests >=2.31.0
    - click >=8.0.0
    - rich >=13.0.0
    - pyyaml >=6.0.0
  run_constraints:
    # Optional dependencies (PyPI extras): only constrained when installed alongside
    - pandas >=2.2.3
    - polars >=1.33.0
    - chatlas >=0.10.0
    - anthropic >=0.68.0
    - openai >=1.63.0
    - opentelemetry-api >=1.23.0
    - opentelemetry-sdk >=1.23.0
    - ibis-framework-core >=11.0.0
    - python-duckdb <2
    - sqlglot >=23.4,<30.18

tests:
  - python:
      imports:
        - pointblank
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Find out if your data is what you think it is.
  homepage: https://posit-dev.github.io/pointblank/
  repository: https://github.com/posit-dev/pointblank

extra:
  recipe-maintainers:
    - rich-iannone
    - timkpaine
